services:
  frontend:
    build: .
    args:
      VITE_API_URL: http://localhost:4001
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
  api:
    build: ./server
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      OPTIMIZER_URL: http://engine:5000
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  engine:
    build: ./engine
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5